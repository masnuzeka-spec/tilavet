<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AGS Hazırlık Botu</title>
    <style>
        :root {
            --zumrut-yesili: #10b981;
            --zumrut-koyu: #059669;
            --kahve-tonu: #8b4513;
            --kahve-acik: #fdf8f5;
            --metin-koyu: #333333;
            --metin-acik: #666666;
            --arkaplan: #f4f7f6;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--arkaplan);
            color: var(--metin-koyu);
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .header {
            background-color: var(--zumrut-yesili);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 12px;
            background-color: white;
            color: var(--metin-koyu);
            border: 2px solid var(--zumrut-yesili);
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            position: relative;
        }

        .btn:hover, .btn:active {
            background-color: var(--kahve-acik);
        }

        .btn-ders {
            border-left: 6px solid var(--zumrut-yesili);
        }

        .btn-bolum {
            border-left: 6px solid var(--kahve-tonu);
        }

        .soru-karti {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .soru-metni {
            font-size: 17px;
            line-height: 1.5;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .secenek {
            display: block;
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 10px;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
        }

        .secenek.dogru { background-color: #d1e7dd; border-color: #badbcc; color: #0f5132; }
        .secenek.yanlis { background-color: #f8d7da; border-color: #f5c2c7; color: #842029; }
        .secenek:disabled { cursor: not-allowed; }

        .durum-cubugu {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 14px;
            color: var(--metin-acik);
            font-weight: bold;
        }

        .ileri-btn {
            background-color: var(--zumrut-yesili);
            color: white;
            border: none;
            text-align: center;
            margin-top: 15px;
            display: none;
        }

        .sonuc-ekrani {
            text-align: center;
            padding: 30px 10px;
        }

        .sonuc-ekrani h1 { color: var(--zumrut-yesili); }
        .sonuc-ekrani p { font-size: 18px; margin: 20px 0; }
        
        .loader {
            text-align: center;
            padding: 50px;
            font-weight: bold;
            color: var(--zumrut-yesili);
        }

        /* Ekranları Gizleme */
        #dersler-ekrani, #bolumler-ekrani, #sinav-ekrani, #sonuc-ekrani { display: none; }
    </style>
</head>
<body>

    <div class="header" id="baslik">AGS Hazırlık Botu</div>

    <div class="container">
        <div id="loader" class="loader">Sorular Yükleniyor, Lütfen Bekleyin...</div>

        <div id="dersler-ekrani"></div>

        <div id="bolumler-ekrani"></div>

        <div id="sinav-ekrani">
            <div class="durum-cubugu">
                <span id="soru-sayaci">Soru: 1/25</span>
                <span id="puan-sayaci">Doğru: 0 | Yanlış: 0</span>
            </div>
            <div class="soru-karti">
                <div id="soru-metni" class="soru-metni">Soru metni buraya gelecek...</div>
                <div id="secenekler"></div>
                <button id="ileri-btn" class="btn ileri-btn" onclick="sonrakiSoru()">Sonraki Soru ➔</button>
            </div>
        </div>

        <div id="sonuc-ekrani" class="sonuc-ekrani">
            <h1>Test Bitti!</h1>
            <p id="sonuc-metni">Toplam 25 soruda 20 doğru yaptınız.</p>
            <button class="btn btn-ders" style="background-color: var(--zumrut-yesili); color: white;" onclick="anaMenuyeDon()">Ana Menüye Dön</button>
        </div>
    </div>

    <script>
        // --- BURAYA KENDİ GOOGLE SCRIPT LİNKİNİ YAPIŞTIR ---
        const API_URL = "https://script.google.com/macros/s/AKfycbzz9HW0LR_AN1gBft0v-l0BgplRaJzyw55f50A9JZ0Xasn06c19nfUuLjzr2h8lJob5Tw/exec";
        // --------------------------------------------------

        let tumSorular = [];
        let dersler = {};
        let aktifBolumSorulari = [];
        let aktifSoruIndex = 0;
        let dogruSayisi = 0;
        let yanlisSayisi = 0;

        // Sayfa açıldığında verileri çek
        window.onload = function() {
            fetch(API_URL)
                .then(response => response.json())
                .then(data => {
                    tumSorular = data;
                    verileriIsle();
                })
                .catch(error => {
                    document.getElementById('loader').innerText = "Veriler çekilirken hata oluştu!";
                    console.error("Hata:", error);
                });
        };

        // Verileri Derslere ve 25'li Bölümlere Ayır
        function verileriIsle() {
            tumSorular.forEach(soru => {
                let dersAdi = soru["Ders"];
                if (!dersAdi) return; 

                if (!dersler[dersAdi]) {
                    dersler[dersAdi] = [];
                }
                dersler[dersAdi].push(soru);
            });

            ekranGoster('dersler-ekrani');
            dersleriListele();
        }

        function dersleriListele() {
            const container = document.getElementById('dersler-ekrani');
            container.innerHTML = '<h3>Hangi dersten çözmek istersin?</h3>';
            
            for (let dersAdi in dersler) {
                let btn = document.createElement('button');
                btn.className = 'btn btn-ders';
                let soruSayisi = dersler[dersAdi].length;
                btn.innerHTML = `📚 ${dersAdi} <span style="float:right; font-size:12px; color:gray; margin-top:3px;">${soruSayisi} Soru</span>`;
                btn.onclick = () => bolumleriListele(dersAdi);
                container.appendChild(btn);
            }
        }

        function bolumleriListele(dersAdi) {
            document.getElementById('baslik').innerText = dersAdi;
            const container = document.getElementById('bolumler-ekrani');
            container.innerHTML = `<button class="btn" style="background:var(--arkaplan); border:none; text-align:center; color:var(--zumrut-yesili);" onclick="anaMenuyeDon()">⬅ Geri Dön</button>`;
            
            let sorular = dersler[dersAdi];
            let bolumSayisi = Math.ceil(sorular.length / 25);

            for (let i = 0; i < bolumSayisi; i++) {
                let baslangic = i * 25;
                let bitis = Math.min((i + 1) * 25, sorular.length);
                let bolumSorulari = sorular.slice(baslangic, bitis);

                let btn = document.createElement('button');
                btn.className = 'btn btn-bolum';
                btn.innerHTML = `📝 Bölüm ${i + 1} <span style="float:right; font-size:13px; color:gray; margin-top:2px;">(${baslangic + 1}-${bitis})</span>`;
                btn.onclick = () => sinaviBaslat(bolumSorulari);
                container.appendChild(btn);
            }

            ekranGoster('bolumler-ekrani');
        }

        function sinaviBaslat(sorular) {
            aktifBolumSorulari = sorular;
            aktifSoruIndex = 0;
            dogruSayisi = 0;
            yanlisSayisi = 0;
            soruGoster();
            ekranGoster('sinav-ekrani');
        }

        function soruGoster() {
            let soru = aktifBolumSorulari[aktifSoruIndex];
            document.getElementById('soru-sayaci').innerText = `Soru: ${aktifSoruIndex + 1}/${aktifBolumSorulari.length}`;
            document.getElementById('puan-sayaci').innerText = `Doğru: ${dogruSayisi} | Yanlış: ${yanlisSayisi}`;
            
            document.getElementById('soru-metni').innerText = soru["Soru Metni"];
            
            const seceneklerDiv = document.getElementById('secenekler');
            seceneklerDiv.innerHTML = '';
            document.getElementById('ileri-btn').style.display = 'none';

            // Şıkların Google Sheets'teki sütun adları (A Seçeneği veya sadece A yazmış olabilirsin)
            const harfler = ['A', 'B', 'C', 'D', 'E'];
            
            harfler.forEach(harf => {
                let secenekMetni = soru[`${harf} Seçeneği`] || soru[harf];
                if (secenekMetni) {
                    let btn = document.createElement('button');
                    btn.className = 'secenek';
                    btn.innerText = `${harf}) ${secenekMetni}`;
                    btn.onclick = () => cevapKontrol(btn, harf, soru["Doğru Cevap"]);
                    seceneklerDiv.appendChild(btn);
                }
            });
        }

        function cevapKontrol(secilenBtn, secilenHarf, dogruHarf) {
            let butonlar = document.getElementById('secenekler').getElementsByTagName('button');
            
            // Tüm butonları pasif yap
            for (let btn of butonlar) {
                btn.disabled = true;
                // Doğru olanı her halükarda yeşil yak
                if (btn.innerText.startsWith(dogruHarf.trim().toUpperCase() + ")")) {
                    btn.classList.add('dogru');
                }
            }

            // Seçilen cevap doğru mu yanlış mı?
            if (secilenHarf.trim().toUpperCase() === dogruHarf.trim().toUpperCase()) {
                dogruSayisi++;
            } else {
                secilenBtn.classList.add('yanlis');
                yanlisSayisi++;
            }

            document.getElementById('puan-sayaci').innerText = `Doğru: ${dogruSayisi} | Yanlış: ${yanlisSayisi}`;
            
            // İleri butonunu veya bitir butonunu göster
            let ileriBtn = document.getElementById('ileri-btn');
            ileriBtn.style.display = 'block';
            if (aktifSoruIndex === aktifBolumSorulari.length - 1) {
                ileriBtn.innerText = "Testi Bitir 🏁";
            } else {
                ileriBtn.innerText = "Sonraki Soru ➔";
            }
        }

        function sonrakiSoru() {
            if (aktifSoruIndex < aktifBolumSorulari.length - 1) {
                aktifSoruIndex++;
                soruGoster();
            } else {
                testiBitir();
            }
        }

        function testiBitir() {
            document.getElementById('sonuc-metni').innerHTML = `
                Toplam <b>${aktifBolumSorulari.length}</b> soruda <br><br>
                <span style="color:var(--zumrut-koyu); font-size:24px;"><b>${dogruSayisi} Doğru</b></span> <br>
                <span style="color:#842029; font-size:24px;"><b>${yanlisSayisi} Yanlış</b></span>
            `;
            ekranGoster('sonuc-ekrani');
        }

        function anaMenuyeDon() {
            document.getElementById('baslik').innerText = "AGS Hazırlık Botu";
            ekranGoster('dersler-ekrani');
        }

        function ekranGoster(ekranId) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('dersler-ekrani').style.display = 'none';
            document.getElementById('bolumler-ekrani').style.display = 'none';
            document.getElementById('sinav-ekrani').style.display = 'none';
            document.getElementById('sonuc-ekrani').style.display = 'none';
            
            document.getElementById(ekranId).style.display = 'block';
        }
    </script>
</body>
</html>
